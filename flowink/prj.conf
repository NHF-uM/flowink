CONFIG_LOG=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_OFF=y
CONFIG_SDHC=y
CONFIG_SPI=y
# FAT32
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_FSTAB_AUTOMOUNT=y
# 不开启LFN的情况下，文件名长度最大为8.3（后缀名占3字符），且不支持中文
CONFIG_FS_FATFS_LFN=y
# 没有fatfs格式化的业务需求
CONFIG_FS_FATFS_MOUNT_MKFS=n
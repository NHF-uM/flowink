# ====================== 基础系统 & 内存配置 ======================
CONFIG_INIT_STACKS=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# PSRAM 配置
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
# 开了会系统崩溃
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# ZVFS / Eventfd 文件抽象层
CONFIG_ZVFS=y
CONFIG_ZVFS_POLL_MAX=32
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_ZVFS_EVENTFD=y
CONFIG_EVENTFD=y

# ====================== 日志子系统 ======================
CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_LED_STRIP_LOG_LEVEL_OFF=y

# ====================== LED 灯带驱动 ======================
CONFIG_LED_STRIP=y

# ====================== 网络总开关 & 协议基础 ======================
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y

# IP 协议栈，暂不开启 ipv6
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_IF_MAX_IPV4_COUNT=1
# CONFIG_NET_IF_MAX_IPV6_COUNT=2

# 协议
CONFIG_NET_TCP=y

# 网络缓冲区
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# 连接与上下文资源限制
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# TCP 参数调优
# Required to handle large number of consecutive connections,
# e.g. when testing with ApacheBench.
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# 网络管理层 & 事件通知
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096

# 二层链路
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# 网络自动初始化与静态地址配置，请注意，该功能并非用于正式配置部署，仅适用于快速取样与测试。
CONFIG_NET_CONFIG_SETTINGS=y
# 自动初始化需要开启 CONFIG_NET_CONFIG_SETTINGS， If you do not wish to do this, then disable this and call net_config_init() in your application.
CONFIG_NET_CONFIG_AUTO_INIT=n

# 连接管理
CONFIG_NET_CONNECTION_MANAGER=y

# DHCPv4 服务端（AP 分配客户端IP）
CONFIG_NET_DHCPV4_SERVER=y
# 断连后释放 ip 的触发时间
CONFIG_NET_DHCPV4_SERVER_ADDR_LEASE_TIME=120
# 给自己申请ip
# CONFIG_NET_DHCPV4=y

# ====================== WIFI 驱动与模式配置 ======================
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_ESP32=y
# 只开启 AP 模式
CONFIG_WIFI_USAGE_MODE_AP=y

# AP 参数
CONFIG_WIFI_AP_SSID="FlowInk-AP"
CONFIG_WIFI_AP_PSK="hhhhhhhh"
CONFIG_WIFI_AP_IP_ADDRESS="192.168.4.1"
CONFIG_WIFI_AP_NETMASK="255.255.255.0"

# ====================== HTTP 服务栈 ======================
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n

# ====================== 可选组件（当前注释未启用） ======================
# JSON
# CONFIG_JSON_LIBRARY=y

CONFIG_LED_STRIP=y
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_RETAINED_MEM=y
# 功能没问题，但是Zephyr日志报一直报警告说rtc_counter未开启
CONFIG_COUNTER=y
CONFIG_SPI=y
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
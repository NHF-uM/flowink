CONFIG_LOG=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_OFF=y

# Wi-Fi Configuration
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
# 只开启 AP 模式，关闭 STA 模式
CONFIG_WIFI_USAGE_MODE_AP=y

# 自动初始化需要开启 CONFIG_NET_CONFIG_SETTINGS， If you do not wish to do
# this, then disable this and call net_config_init() in your application.
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y

# 给自己申请ip
# CONFIG_NET_DHCPV4=y
# 给客户分配ip，关掉之后eventfd就不报错（-12）了
CONFIG_NET_DHCPV4_SERVER=y
# 由4改为1，后期出问题可以检查
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=1
# 不开 sta，只有 ap 一个虚拟网卡
CONFIG_NET_IF_MAX_IPV4_COUNT=1

CONFIG_NET_IPV4=y
# 暂时不连接公网 WIFI，关闭 IPV6
CONFIG_NET_IPV6=n
# CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
# ap 例程里面没开 NET_SOCKETS_SERVICE（下面这个的依赖）
# CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP=y
CONFIG_NETWORKING=y

# LOG Configuration
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_SERVER_LOG_LEVEL_DBG=y

CONFIG_WIFI_ESP32=y
CONFIG_WIFI_AP_SSID="FlowInk-AP"
CONFIG_WIFI_AP_PSK="hhhhhhhh"
CONFIG_WIFI_AP_IP_ADDRESS="192.168.4.1"
CONFIG_WIFI_AP_NETMASK="255.255.255.0"

# General config
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_ZVFS_POLL_MAX=32
CONFIG_ZVFS_EVENTFD_MAX=2

CONFIG_EVENTFD=y

# Networking config
CONFIG_NET_SOCKETS=y

# JSON
# CONFIG_JSON_LIBRARY=y

# Network buffers
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_CONTEXT_NET_PKT_POOL=y

# IP address options
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32

# 前面的都是 http_server 的 select
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_PARSER=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS=y
CONFIG_ZVFS_EVENTFD=y
CONFIG_HTTP_SERVER=y

# 请注意，该功能并非用于正式配置部署，仅适用于快速取样与测试。
CONFIG_NET_CONFIG_SETTINGS=y

# Networking tweaks
# Required to handle large number of consecutive connections,
# e.g. when testing with ApacheBench.
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
# 开了会系统崩溃
# CONFIG_ESP_WIFI_HEAP_SPIRAM=y

CONFIG_HTTP_SERVER_VERSION_2=n


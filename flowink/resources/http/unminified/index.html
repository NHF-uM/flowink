<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>FlowInk Photographer</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;background:#fff;font-family:Verdana,Arial,sans-serif}
        .container-wrap{width:auto;max-width:960px;margin:12px auto;background:#7dd4fa;border-radius:16px;padding:12px}
        .title-text{font-size:clamp(26px,4vw,40px);text-align:center;margin:0 0 10px 0;font-weight:bold;color:#142ebe}
        .main-row{display:flex;gap:12px;align-items:flex-start}
        .menu_bar{width:250px;flex-shrink:0;background:#d2ecfc;border:2px solid #2748f5;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
        .bottom-btn{width:100%;padding:11px 12px;background-color:#2748f5;border:none;border-radius:8px;color:white;font-size:16px;cursor:pointer;transition:0.2s ease}
        .bottom-btn:hover{background-color:#142ebe}
        .comment{color:#142ebe;font-size:15px;font-weight:bold}
        .nud{width:66px;padding:5px 4px;border:1px solid #2748f5;border-radius:6px;text-align:center;font-size:15px}
        .offset-row{display:flex;gap:6px;align-items:center}
        .refresh-btn{padding:6px 12px;background-color:#2748f5;border:none;border-radius:6px;color:white;font-size:14px;cursor:pointer}
        .slider-row{display:flex;flex-direction:column;gap:5px}
        .slider-row .slider-head{display:flex;justify-content:space-between;align-items:center}
        .slider-row label{font-size:14px;color:#142ebe;font-weight:bold}
        .slider-row .slider-val{width:72px;padding:3px 4px;border:1px solid #2748f5;border-radius:5px;text-align:center;font-size:14px}
        .slider-row input[type=range]{width:100%}
        .avatar-box{text-align:center}
        .avatar-box img{height:130px;width:auto;border-radius:10px;box-shadow:0 2px 8px #0003}
        .content_body{flex:1;display:flex;flex-direction:column;gap:12px}
        .img-panel{width:100%;background:#fff;border:2px solid #2244ff;border-radius:12px;padding:8px;text-align:center}
        canvas#source{display:block;margin:0 auto;max-width:100%;max-height:34vh;height:auto}
        #canvas{display:block;margin:0 auto;max-width:100%;max-height:70vh;height:auto}
        @media (max-width:800px){
            .main-row{flex-direction:column}
            .menu_bar{width:100%}
        }
    </style>
</head>

<body>
    <div class="container-wrap">
        <p class="title-text">FlowInk Photographer</p>
        <div class="main-row">
            <div class="menu_bar">
                <button class="bottom-btn" id="Input_Button" type="button">选择图片</button>
                <input type="file" id="File_Input" accept="image/*" hidden>
                <button class="bottom-btn" id="Lvl_Button" type="button">阈值转换</button>
                <button class="bottom-btn" id="Dif_Button" type="button">扩散转换</button>
                <button class="bottom-btn" id="Send_Button" type="button">上传图片</button>
                <span class="comment">裁剪偏移</span>
                <div class="offset-row">
                    <label class="comment">x</label>
                    <input id="nud_x" class="nud" type="number" value="0">
                    <label class="comment">y</label>
                    <input id="nud_y" class="nud" type="number" value="0">
                </div>
                <div class="offset-row">
                    <button class="refresh-btn" id="Refresh_Btn" type="button">刷新边框</button>
                </div>
                <span class="comment">调节</span>
                <div class="slider-row">
                    <div class="slider-head"><label>亮度</label><input class="slider-val" id="val_bright" type="number" value="0"></div>
                    <input id="nud_bright" type="range" min="-128" max="128" value="0">
                </div>
                <div class="slider-row">
                    <div class="slider-head"><label>对比度</label><input class="slider-val" id="val_cont" type="number" value="1" step="0.01"></div>
                    <input id="nud_cont" type="range" min="0.5" max="1.5" step="0.01" value="1">
                </div>
                <div class="slider-row" id="row_mono" style="display:none">
                    <div class="slider-head"><label>黑白权重</label><input class="slider-val" id="val_mono" type="number" value="0"></div>
                    <input id="nud_mono" type="range" min="-100" max="100" value="0">
                </div>
                <div class="slider-row" id="row_err" style="display:none">
                    <div class="slider-head"><label>扩散权重</label><input class="slider-val" id="val_err" type="number" value="1" step="0.01"></div>
                    <input id="nud_err" type="range" min="0" max="2" step="0.01" value="1">
                </div>
                <div class="avatar-box"><img src="./zkk.png" alt="zkk"></div>
            </div>
            <div class="content_body">
                <div class="img-panel">
                    <canvas id="source" class="hidden_input" hidden></canvas>
                    <div id="srcBox"></div>
                </div>
                <div class="img-panel" id="dstBox"></div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>

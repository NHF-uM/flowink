<!DOCTYPE html><html data-bs-theme="light" lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"><title>FlowInk Photographer</title><link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css"><style>*{box-sizing:border-box}.container-wrap{width:90vw;max-width:820px;min-width:320px;margin:30px auto;background:#7dd4fa;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}.title-text{font-size:clamp(22px,3vw,36px);text-align:center;margin:0;font-weight:500}.preview-box{flex:1;min-height:420px;width:100%;background:#fff;border:2px solid #2244ff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview-box img{max-width:100%;max-height:100%;object-fit:contain}.bottom-bar{width:100%;min-height:130px;display:flex;align-items:center;justify-content:center;position:relative;padding:16px 24px;gap:20px;background:#7dd4fa}.btn-group-wrap{display:flex;gap:14px}.bottom-btn{min-width:88px;padding:8px 16px;background-color:#2748f5;border:none;border-radius:8px;color:white;font-size:16px;transition:0.2s ease}.bottom-btn:hover{background-color:#142ebe}.avatar-box{position:absolute;right:24px;bottom:16px}.avatar-box img{height:110px;width:auto;border-radius:10px;box-shadow:0 2px 8px #0003}@media (max-width:550px){.bottom-bar{flex-direction:column;padding:20px 16px}.avatar-box{position:static;margin-top:12px}.avatar-box img{height:95px}}</style></head><body><div class="container-wrap"><p class="title-text">FlowInk Photographer</p><div class="preview-box"><input type="file" class="sysInputFile" id="File_Input" hidden><img id="Image_Input"></div><div class="bottom-bar"><div class="btn-group-wrap"><button class="bottom-btn" id="Input_Button" type="button">Input</button><button class="bottom-btn" id="Send_Button" type="button">Send</button></div><div class="avatar-box"><img src="./zkkbb.png" alt="avatar"></div></div></div><script src="assets/bootstrap/js/bootstrap.min.js"></script><script src="assets/js/script.min.js"></script><script>document.getElementById('Input_Button').addEventListener('click',()=>{document.getElementById('File_Input').click()});document.getElementById('File_Input').addEventListener('change',function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=evt=>{document.getElementById('Image_Input').src=evt.target.result};reader.readAsDataURL(file);})</script></body></html>
